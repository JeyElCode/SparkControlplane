[project]
name = "spark-controlplane"
version = "1.34.0"
description = "Web control plane for automating a DGX Spark vLLM cluster (up to 4 nodes)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncssh>=2.18",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "httpx>=0.27",
    "ldap3>=2.9",
    # ID-token verification. Already present transitively via mcp, but declared
    # explicitly: depending on a transitive pin is how this silently breaks.
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "greenlet>=3.0",
    # Capped at <2 deliberately: mcp 2.0 moved `mcp.server.fastmcp`, which
    # app/mcp_server.py imports, and because main.py fail-opens on an MCP import
    # error the only symptom is that /mcp silently does not exist. `mcp>=1.2`
    # let a major bump through and CI caught it resolving 2.0.0. See #67.
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    # Pinned deliberately. An unpinned linter means a new release can turn a
    # green tree red with hundreds of stylistic findings that have nothing to do
    # with the change being reviewed — and a gate that fails for reasons the
    # author did not cause is a gate that gets disabled.
    "ruff==0.15.22",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly rather than inherited from whatever the installed ruff
# defaults to. These are the rules that catch *defects* — undefined names,
# unused bindings, imports that do not resolve, mutable default arguments,
# bare excepts — as opposed to stylistic modernisation, which would churn the
# tree without making anything more correct.
select = [
    "F",    # pyflakes: undefined names, unused imports/variables
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # long lines are a judgement call, not a build failure
]
# Deliberately not yet enabled: "B" (bugbear) and "ASYNC" report 36 findings in
# the current tree, a mix of genuine (raise-from, zip strict=) and
# false-for-this-codebase (ASYNC109 flags the `timeout=` parameter that is this
# project's own SSH API). Adopting them is a change worth making on its own
# terms rather than smuggling into an unrelated batch. See issue tracker.

[tool.pytest.ini_options]
asyncio_mode = "auto"
