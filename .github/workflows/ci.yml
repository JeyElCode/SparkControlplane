name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are pointless and, for the docker job, expensive. Cancel the
# previous run for the same ref when a new commit arrives — except on main,
# where every commit's result is a record worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          pip install .[dev]
          ruff check app tests
          SPARK_DATA_DIR=/tmp/spark pytest -q

  docker-build:
    runs-on: ubuntu-latest
    # A job with no timeout inherits GitHub's six-hour maximum. This one hit it:
    # the arm64 frontend build deadlocked under emulation and burned six hours of
    # billed runner time before being killed, leaving the PR unmergeable. The
    # Dockerfile fix means a healthy build finishes in minutes, so anything past
    # this ceiling is a hang, and a hang should cost twenty minutes to discover.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Registers binfmt handlers explicitly rather than relying on whatever the
      # runner image happens to have pre-registered, so CI and release.yml
      # emulate identically. This is for reproducibility only — it does NOT
      # prevent the SIGILL hang described in the Dockerfile: that was observed
      # both without this action (CI) and with it (the v1.25.0 release).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
