name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    # A tag must not publish an image unless the suite that guards this
    # software's behaviour on real hardware has actually run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          pip install .[dev]
          ruff check app tests
          SPARK_DATA_DIR=/tmp/spark pytest -q
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    # Without this a stalled build sits for six hours holding a release. See the
    # note on the frontend stage in the Dockerfile for how that happened.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jeyelcode/spark-controlplane
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing has ever run the arm64 image — the architecture that is the only
      # one a DGX Spark can execute. Every check so far has been "did the build
      # command exit 0", which cannot catch a wrong-architecture payload. The
      # frontend stage is now built on the runner's architecture on purpose (see
      # the Dockerfile), and this is what keeps that honest: if anyone ever
      # copies a native binary out of that stage, the SPA it serves will be
      # amd64 code inside an arm64 image and this step fails instead of shipping.
      - name: Smoke-test the arm64 image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/jeyelcode/spark-controlplane:${GITHUB_REF_NAME}"
          echo "Verifying $IMAGE runs as linux/arm64 under emulation…"

          # `-i` is load-bearing: without it docker does not attach stdin, so
          # `python -` reads EOF, runs nothing and exits 0. The v1.30.0 release
          # passed this step having executed none of it.
          OUTPUT=$(docker run -i --rm --platform linux/arm64 \
                     --entrypoint python "$IMAGE" - <<'PY'
          import pathlib, platform, sys

          # The interpreter itself proves the image is really aarch64: a
          # mis-tagged amd64 image would report x86_64 here.
          machine = platform.machine()
          print("interpreter arch:", machine, flush=True)
          if machine not in ("aarch64", "arm64"):
              sys.exit(f"expected an aarch64 image, got {machine}")

          # The SPA must be present and non-empty. This is the artifact carried
          # across from the build-platform stage.
          dist = pathlib.Path("/app/frontend/dist")
          index = dist / "index.html"
          if not index.is_file() or index.stat().st_size == 0:
              sys.exit(f"missing or empty {index}")
          assets = [p for p in dist.glob("assets/*.js") if p.stat().st_size > 0]
          if not assets:
              sys.exit(f"no non-empty JS bundle under {dist}/assets")

          # Nothing copied out of the frontend stage may be a native binary.
          # ELF and Mach-O magic both caught, since the build host varies.
          for path in dist.rglob("*"):
              if not path.is_file():
                  continue
              head = path.open("rb").read(4)
              if head[:4] in (b"\x7fELF", b"\xcf\xfa\xed\xfe", b"\xce\xfa\xed\xfe"):
                  sys.exit(f"native binary in the served SPA: {path}")

          # The app must actually import on this architecture — catches a wheel
          # built for the wrong platform slipping into the runtime stage.
          sys.path.insert(0, "/app/backend")
          import app.main  # noqa: F401
          from app import __version__

          print("app imports OK, version", __version__, flush=True)
          print(f"dist OK: index.html + {len(assets)} bundle(s)", flush=True)
          print("SMOKE-OK", flush=True)
          PY
          )
          echo "$OUTPUT"

          # A checked assertion is worthless if the thing asserting can silently
          # not run. The sentinel is the guard on the guard: if the script never
          # executes for ANY reason, there is no SMOKE-OK and this step fails.
          echo "$OUTPUT" | grep -q '^SMOKE-OK$' || {
            echo "::error::the arm64 smoke test produced no SMOKE-OK sentinel — it did not actually run"
            exit 1
          }
